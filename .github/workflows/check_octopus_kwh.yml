name: Check Octopus gas readings API

on:
  workflow_dispatch:
    inputs:
      tariff_audit:
        description: Audit saved Tado gas tariffs against Octopus (no data writes)
        required: false
        default: false
        type: boolean
      days:
        description: Number of recent days to compare
        required: true
        default: '7'
        type: choice
        options:
          - '3'
          - '7'
          - '14'
          - '30'

permissions:
  contents: read

jobs:
  check_octopus_kwh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependency
        if: ${{ !inputs.tariff_audit }}
        run: python -m pip install requests==2.32.5

      - name: Install tariff audit dependencies
        if: ${{ inputs.tariff_audit }}
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Compare Octopus kWh and m³ readings
        if: ${{ !inputs.tariff_audit }}
        run: |
          python check_octopus_kwh.py \
            --api-key "${{ secrets.OCTOPUS_API_KEY }}" \
            --mprn "${{ secrets.OCTOPUS_MPRN }}" \
            --gas-serial-number "${{ secrets.OCTOPUS_GAS_SERIAL }}" \
            --account-number "${{ secrets.OCTOPUS_ACCOUNT_NUMBER }}" \
            --days "${{ inputs.days }}"

      - name: Read-only Tado tariff repair audit
        if: ${{ inputs.tariff_audit }}
        env:
          TADO_EMAIL: ${{ secrets.TADO_EMAIL }}
          TADO_PASSWORD: ${{ secrets.TADO_PASSWORD }}
          OCTOPUS_API_KEY: ${{ secrets.OCTOPUS_API_KEY }}
          OCTOPUS_ACCOUNT_NUMBER: ${{ secrets.OCTOPUS_ACCOUNT_NUMBER }}
          OCTOPUS_MPRN: ${{ secrets.OCTOPUS_MPRN }}
          OCTOPUS_GAS_SERIAL: ${{ secrets.OCTOPUS_GAS_SERIAL }}
        run: python audit_tariffs.py
